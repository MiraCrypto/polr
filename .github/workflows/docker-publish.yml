name: Publish Container Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - tsconfig.build.json
      - 'src/**'
      - 'public/**'
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    name: Build (${{ matrix.variant.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - target: alpine
            suffix: ''
            alias: alpine
            default: true
          - target: debian-slim
            suffix: -debian-slim
            alias: slim
            default: false
          - target: distroless
            suffix: -distroless
            alias: nonroot
            default: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve release version
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata and tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ matrix.variant.default && 'auto' || 'false' }}
            suffix=${{ matrix.variant.suffix }},onlatest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,suffix=,enable=${{ matrix.variant.default && '{{is_default_branch}}' || 'false' }}
            type=raw,value=${{ matrix.variant.target }},suffix=,enable={{is_default_branch}}
            type=raw,value=${{ matrix.variant.alias }},suffix=,enable={{is_default_branch}}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant.target }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            POLR_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=buildx-${{ matrix.variant.target }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=buildx-{0}', matrix.variant.target) || '' }}
